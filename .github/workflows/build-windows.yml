name: Build SAN8R Editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 Build
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Chinese Editor
        shell: powershell
        run: |
          $repo = "${{ github.repository }}"
          $tag = "v1.0"
          $asset = "s8pk_hp_editor1.0_完整中文汉化版_v2.exe"

          Write-Host "=========================================="
          Write-Host "开始下载中文编辑器"
          Write-Host "仓库: $repo"
          Write-Host "版本: $tag"
          Write-Host "文件: $asset"
          Write-Host "=========================================="

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          $encodedAsset = [uri]::EscapeDataString($asset)
          $url = "https://github.com/$repo/releases/download/$tag/$encodedAsset"

          Write-Host "下载地址:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "dist\SAN8R_中文编辑器.exe" `
            -UseBasicParsing

          if (!(Test-Path "dist\SAN8R_中文编辑器.exe")) {
            Write-Error "没有下载到 EXE"
            exit 1
          }

          Write-Host "下载成功！"

      - name: Check EXE
        shell: powershell
        run: |
          $file = Get-Item "dist\SAN8R_中文编辑器.exe"

          Write-Host "=========================================="
          Write-Host "EXE 检查结果"
          Write-Host "文件名: $($file.Name)"
          Write-Host "文件大小: $($file.Length) bytes"
          Write-Host "=========================================="

          if ($file.Length -lt 1000000) {
            Write-Error "EXE 文件异常，大小小于 1 MB"
            exit 1
          }

          Write-Host "EXE 文件正常"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SAN8R-Editor-Windows-x64
          path: dist/SAN8R_中文编辑器.exe
          if-no-files-found: error
          retention-days: 30
