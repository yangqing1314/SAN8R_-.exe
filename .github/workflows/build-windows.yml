name: Build SAN8R Editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 Build
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Editor Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $repo = "${{ github.repository }}"
          $tag = "v1.0"
          $asset = "s8pk_hp_editor1.0_完整中文汉化版_v2.exe"

          Write-Host "========================================"
          Write-Host "下载 SAN8R 中文编辑器"
          Write-Host "仓库: $repo"
          Write-Host "版本: $tag"
          Write-Host "文件: $asset"
          Write-Host "========================================"

          gh release download $tag `
            --repo $repo `
            --pattern $asset `
            --dir dist `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release 文件下载失败"
            exit 1
          }

          $downloaded = Join-Path "dist" $asset

          if (!(Test-Path $downloaded)) {
            Write-Error "没有找到下载后的 EXE：$downloaded"
            Get-ChildItem -Path dist
            exit 1
          }

          Rename-Item `
            -Path $downloaded `
            -NewName "SAN8R_中文编辑器.exe"

      - name: Verify EXE
        shell: powershell
        run: |
          $exe = Get-Item "dist\SAN8R_中文编辑器.exe"

          Write-Host "========================================"
          Write-Host "EXE 检查"
          Write-Host "文件：$($exe.FullName)"
          Write-Host "大小：$($exe.Length) bytes"
          Write-Host "========================================"

          if ($exe.Length -lt 1000000) {
            Write-Error "EXE 文件异常过小"
            exit 1
          }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SAN8R-Editor-Windows-x64
          path: dist/SAN8R_中文编辑器.exe
          if-no-files-found: error
          retention-days: 30
