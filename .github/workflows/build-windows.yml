name: Build SAN8R Editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 Build
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Editor Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "=========================================="
          Write-Host "下载 SAN8R 中文编辑器"
          Write-Host "=========================================="

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          gh release download v1.0 `
            --repo "${{ github.repository }}" `
            --pattern "*.exe" `
            --dir "dist" `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Release EXE 下载失败"
            exit 1
          }

          Write-Host "Release 下载完成"

          Get-ChildItem "dist"

      - name: Find EXE
        shell: powershell
        run: |
          $exe = Get-ChildItem "dist\*.exe" | Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error "没有找到 EXE 文件"
            exit 1
          }

          Write-Host "找到 EXE:"
          Write-Host $exe.FullName
          Write-Host "文件大小:"
          Write-Host $exe.Length

          if ($exe.Length -lt 1000000) {
            Write-Error "EXE 文件异常过小"
            exit 1
          }

          Rename-Item `
            -Path $exe.FullName `
            -NewName "SAN8R_中文编辑器.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SAN8R-Editor-Windows-x64
          path: dist/SAN8R_中文编辑器.exe
          if-no-files-found: error
          retention-days: 30
